name: Desktop preview builds

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  macos:
    name: Build unsigned macOS preview
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS app bundle
        run: npm run desktop:build -- --bundles app

      - name: Create unsigned macOS DMG preview
        shell: bash
        run: |
          set -euo pipefail
          staging_dir="$(mktemp -d)"
          trap 'rm -rf "$staging_dir"' EXIT
          mkdir -p src-tauri/target/release/bundle/dmg
          cp -R src-tauri/target/release/bundle/macos/ExtractMint.app "$staging_dir/ExtractMint.app"
          ln -s /Applications "$staging_dir/Applications"
          hdiutil create \
            -volname "ExtractMint Preview" \
            -srcfolder "$staging_dir" \
            -ov \
            -format UDZO \
            src-tauri/target/release/bundle/dmg/ExtractMint-unsigned-preview.dmg

      - name: Upload unsigned macOS DMG preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extractmint-macos-unsigned-preview-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Package unsigned macOS app bundle preview
        run: tar -cf extractmint-macos-unsigned-preview-app.tar -C src-tauri/target/release/bundle/macos ExtractMint.app

      - name: Upload unsigned macOS app bundle preview
        uses: actions/upload-artifact@v7.0.2
        with:
          path: extractmint-macos-unsigned-preview-app.tar
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build unsigned Windows preview
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows NSIS preview
        run: npm run desktop:build -- --bundles nsis

      - name: Upload unsigned Windows NSIS setup preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extractmint-windows-unsigned-preview-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
