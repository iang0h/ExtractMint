name: Publish desktop downloads manifest

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-downloads-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    name: Enable downloads for a complete public desktop release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate the published release and update the manifest
        run: node scripts/update-desktop-downloads-manifest.mjs

      - name: Commit and push the changed manifest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- public/desktop/downloads.json
          if git diff --cached --quiet -- public/desktop/downloads.json; then
            echo 'Desktop downloads manifest is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: publish desktop downloads manifest' -- public/desktop/downloads.json
          git push origin "HEAD:$DEFAULT_BRANCH"
